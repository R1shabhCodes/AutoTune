version: '3.8'

services:
  autotune-engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: autotune-engine
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./engine/autotune.db:/app/engine/autotune.db
      - ./engine/config.py:/app/engine/config.py
      - ./apps/rag_finance/config.json:/app/apps/rag_finance/config.json
    restart: unless-stopped

  rag-chatbot:
    build:
      context: ./apps/rag_finance
      dockerfile: Dockerfile
    container_name: rag-chatbot
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/rag_finance/config.json:/app/config.json
      - ./apps/rag_finance/documents:/app/documents
    restart: unless-stopped
